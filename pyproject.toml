[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hhg9"
version = "0.2.0a0"
description = "Hierarchical hexagonal grid on an octahedral reference ellipsoid"
readme = { file = "README", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Ben Griffin" }
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "numpy>=2.0.0",
  "scipy>=1.11.0",
  "geographiclib>=2.0"
]

[project.urls]
Homepage = "https://github.com/MrBenGriffin/hex9"
Documentation = "https://github.com/MrBenGriffin/hex9/blob/main/README.md"
Repository = "https://github.com/MrBenGriffin/hex9"
Issues = "https://github.com/MrBenGriffin/hex9/issues"
Changelog = "https://github.com/MrBenGriffin/hex9/releases"
"libhex9 (C++ accelerator)" = "https://github.com/MrBenGriffin/libhex9"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
geo = ["pyproj>=3.0.0", "gdal>=3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hhg9*"]

[tool.setuptools.package-data]
"hhg9" = ["data/*.npz", "h9/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Run coverage on demand with:  pytest --cov
# (kept out of addopts so the default `pytest` stays fast)
[tool.coverage.run]
source = ["hhg9"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
